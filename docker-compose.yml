version: "3.9"
services:
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ADDR: "${APP_ADDR}"
      DB_PATH: "${DB_PATH}"
      JWT_SECRET: "${JWT_SECRET}"
      SEED_ADMIN_PASSWORD: "${SEED_ADMIN_PASSWORD}"
      SEED_OPERATOR_PASSWORD: "${SEED_OPERATOR_PASSWORD}"
      SEED_VIEWER_PASSWORD: "${SEED_VIEWER_PASSWORD}"

